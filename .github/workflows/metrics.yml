name: metrics

# Generates a GitHub stats SVG (metrics.svg) and commits it back to the repo.
# The README references the committed SVG directly, avoiding any runtime
# dependency on third-party rendering services.

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC (~02:00 ET)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metrics.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics.svg
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6  # v3.34
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: cbeaulieu-gt
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York

          # Languages plugin — populated alongside the base card so the
          # renderer has the anchor it needs to display language rows.
          plugin_languages: yes
          plugin_languages_ignored: html, css, dockerfile, makefile, batchfile
          plugin_languages_categories: markup, programming
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 0%
          plugin_languages_colors: github
          plugin_languages_limit: 8
