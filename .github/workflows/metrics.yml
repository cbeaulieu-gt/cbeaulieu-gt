name: metrics

# Generates GitHub stats SVGs (metrics.svg, metrics-langs.svg) and commits
# them back to the repo. The README references the committed SVGs directly,
# avoiding any runtime dependency on third-party rendering services.

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC (~02:00 ET)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metrics.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: General stats card
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6  # v3.34
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: cbeaulieu-gt
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York

      - name: Languages breakdown
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6  # v3.34
        with:
          filename: metrics-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: cbeaulieu-gt
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css, dockerfile, makefile, batchfile
          plugin_languages_categories: markup, programming
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 0%
          plugin_languages_colors: github
          plugin_languages_limit: 8
          config_timezone: America/New_York
